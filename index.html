<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6f8f7">
<title>Gravity Sales Walkthrough</title>
<style>
:root{--bg:#f5f7f6;--card:#fff;--ink:#17312e;--muted:#6d7d79;--line:#dce5e1;--accent:#0e746c;--soft:#e5f4f0;--danger:#a33d35}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--ink)}
header{position:sticky;top:0;z-index:10;background:#ffffffee;backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:14px 14px 10px}
.brand{display:flex;align-items:center;gap:10px;max-width:760px;margin:auto}.logo{width:38px;height:38px;border-radius:12px;background:var(--accent);color:white;display:grid;place-items:center;font-weight:900}
.brand b{display:block}.brand small{color:var(--muted)}.progress{height:6px;background:#e1e8e5;border-radius:99px;overflow:hidden;margin:12px auto 8px;max-width:760px}.bar{height:100%;background:var(--accent);width:20%;transition:.2s}
.tabs{display:flex;gap:7px;overflow:auto;max-width:760px;margin:auto}.tab{white-space:nowrap;border:1px solid var(--line);background:white;border-radius:99px;padding:7px 10px;font-size:11px;font-weight:800;color:var(--muted)}.tab.active{background:var(--accent);color:white;border-color:var(--accent)}
main{max-width:760px;margin:auto;padding:16px 13px 100px}.hero,.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px;box-shadow:0 8px 24px #163a3010}.hero h1{font-size:24px;margin:4px 0 8px}.hero p,.sub{color:var(--muted);font-size:13px;line-height:1.45}
h2{font-size:16px;margin:0 0 12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.wide{grid-column:1/-1}
label{display:block;font-size:11px;font-weight:800;color:#536560;margin-bottom:5px;text-transform:uppercase}input,select,textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px;background:#fbfcfb;color:var(--ink);font:inherit}textarea{min-height:82px;resize:vertical}.field{margin-bottom:10px}
.pills,.systems{display:grid;grid-template-columns:1fr 1fr;gap:8px}.pill,.system{border:1px solid var(--line);border-radius:13px;padding:12px;background:white;text-align:left;font-weight:750;color:var(--ink)}.pill.on,.system.on{background:var(--soft);border-color:#86beb7}.pill small,.system small{display:block;color:var(--muted);font-weight:500;margin-top:4px}
.pkg{border:1px solid var(--line);border-radius:15px;padding:13px;margin-bottom:10px}.pkg.rec{background:var(--soft);border-color:#7dbab2}.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}.price{font-size:22px;font-weight:900}.tag{display:inline-block;border-radius:99px;padding:5px 8px;background:#edf2ef;font-size:10px;font-weight:900}
.mat{border:1px solid var(--line);border-radius:13px;padding:11px;margin-bottom:8px}.mathead{display:flex;gap:9px;align-items:flex-start}.mathead input{width:20px;height:20px}.matopts{display:grid;grid-template-columns:70px 1fr;gap:7px;margin-top:9px}.matopts input,.matopts select{padding:9px}
.summary{display:grid;grid-template-columns:1fr 1fr;gap:8px}.box{background:#f8faf9;border:1px solid var(--line);border-radius:13px;padding:12px}.box small{color:var(--muted);display:block}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:0;border-radius:12px;padding:12px 14px;font-weight:850}.primary{background:var(--accent);color:white}.secondary{background:#eef3f1;color:var(--ink)}.danger{background:#faece9;color:var(--danger)}
footer{position:fixed;bottom:0;left:0;right:0;background:#fffffff5;border-top:1px solid var(--line);padding:10px 12px max(10px,env(safe-area-inset-bottom));z-index:20}.footin{max-width:760px;margin:auto;display:flex;gap:8px}.footin button{flex:1}
@media(max-width:540px){.grid,.pills,.systems,.summary{grid-template-columns:1fr}.wide{grid-column:auto}.hero h1{font-size:22px}}
</style>
</head>
<body>
<header>
<div class="brand"><div class="logo">G</div><div><b>GRAVITY SALES WALKTHROUGH</b><small>Mobile consultation & parts handoff</small></div><button class="btn secondary" id="sample" style="margin-left:auto">Load sample</button></div>
<div class="progress"><div class="bar" id="bar"></div></div>
<div class="tabs" id="tabs"></div>
</header>
<main id="app"></main>
<footer><div class="footin"><button class="btn secondary" id="back">Back</button><button class="btn primary" id="next">Next</button></div></footer>
<script>
const steps=['Customer','Discovery','Solutions','Materials','Review'];
const mats=[
['furnace','Furnace','Gas furnace','1'],['furnace-filter','Furnace','Filter rack / media cabinet','1'],['furnace-vent','Furnace','Venting materials','1'],['furnace-drain','Furnace','Condensate drain materials','1'],['furnace-trans','Furnace','Supply transition / sheet metal','1'],
['hp','Heat Pump','Outdoor heat-pump unit','1'],['hp-coil','Heat Pump','Indoor coil','1'],['hp-lineset','Heat Pump','Line set / refrigeration materials','1'],['hp-pad','Heat Pump','Equipment pad / stand','1'],['hp-elec','Heat Pump','Disconnect / electrical whip','1'],
['ac','Central AC','Outdoor AC condenser','1'],['ac-coil','Central AC','Evaporator coil','1'],['ac-line','Central AC','Line set / fittings','1'],['ac-pad','Central AC','Pad / brackets','1'],
['humid','Humidifier','Humidifier','1'],['humid-kit','Humidifier','Water / drain / bypass kit','1'],
['tank','Water Heater','Storage water heater','1'],['tank-vent','Water Heater','Venting / fittings','1'],
['tankless','Tankless','Tankless water heater','1'],['tankless-vent','Tankless','Venting kit','1'],['tankless-valves','Tankless','Isolation valve kit','1'],
['common','Common','Thermostat / controls','1'],['common-elec','Common','Electrical materials','1'],['common-fast','Common','Fasteners / sealants / consumables','1']
];
const blank=()=>({step:0,customer:{name:'',phone:'',email:'',address:'',city:'',rep:''},discovery:{need:'',decision:'',urgency:'',comfort:'',equipment:'',air:'',humidity:'',water:'',access:'',duct:'',electric:'',outdoor:''},flags:[],systems:[],packages:[{tier:'Best',name:'Dual Fuel System',price:18995},{tier:'Better',name:'Cold Climate Heat Pump',price:15495},{tier:'Good',name:'96% Furnace + AC',price:11995}],recommended:'Best',materials:{},notes:''});
let s=JSON.parse(localStorage.getItem('gravity-walkthrough')||'null')||blank();
const save=()=>localStorage.setItem('gravity-walkthrough',JSON.stringify(s)); const esc=x=>String(x??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const field=(lab,key,val,type='input',ph='')=>`<div class="field"><label>${lab}</label>${type==='textarea'?`<textarea data-k="${key}" placeholder="${ph}">${esc(val)}</textarea>`:`<input data-k="${key}" value="${esc(val)}" placeholder="${ph}">`}</div>`;
function head(title,sub){return `<section class="hero"><h1>${title}</h1><p>${sub}</p></section>`}
function renderTabs(){tabs.innerHTML=steps.map((x,i)=>`<button class="tab ${i===s.step?'active':''}" data-step="${i}">${i+1}. ${x}</button>`).join('');bar.style.width=((s.step+1)*20)+'%';document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{s.step=+b.dataset.step;save();render()})}
function customer(){return head('Start the walkthrough','Capture the customer, home and appointment context first.')+`
<section class="card"><h2>Customer & appointment</h2><div class="grid">
${field('Customer name','customer.name',s.customer.name)}${field('Phone','customer.phone',s.customer.phone)}${field('Email','customer.email',s.customer.email)}${field('Sales rep','customer.rep',s.customer.rep)}${field('Address','customer.address',s.customer.address)}${field('City','customer.city',s.customer.city)}
</div></section><section class="card"><h2>Site photos</h2><p class="sub">Use your phone camera to capture equipment, mechanical room, electrical panel, thermostat, ductwork and exterior location.</p><input type="file" accept="image/*" capture="environment" multiple><p class="sub">This demo keeps photos on the device only.</p></section>`}
function discovery(){let fs=[['Why did they call?','need','What is the main problem or goal?'],['Decision makers','decision','Who needs to be involved?'],['Timing / urgency','urgency','When do they want this completed?'],['Comfort issues','comfort','Hot/cold rooms, airflow, noise, humidity...'],['Existing equipment','equipment','Type, age, service history...'],['Air quality','air','Dust, allergies, pets, filtration...'],['Humidity','humidity','Dry in winter? Too humid?'],['Water heating','water','Tank age, hot water concerns...'],['Access','access','Mechanical room access, stairs, tight spaces...'],['Ductwork / venting','duct','Condition and modifications required...'],['Electrical','electric','Panel size, breaker space, upgrades...'],['Outdoor location','outdoor','Pad, snow clearance, line-set route...']];return head('Discovery','A structured conversation that helps the rep uncover needs and install considerations.')+`<section class="card"><h2>Discovery questions</h2>${fs.map(x=>field(x[0],'discovery.'+x[1],s.discovery[x[1]],'textarea',x[2])).join('')}</section><section class="card"><h2>Opportunity flags</h2><div class="pills">${['Financing','Membership','Humidifier','IAQ / filtration','Duct modification','Thermostat upgrade','Electrical upgrade','Water heater','Complex install'].map(x=>`<button class="pill ${s.flags.includes(x)?'on':''}" data-flag="${x}">${x}</button>`).join('')}</div></section>`}
function solutions(){return head('Build the solution','Identify equipment opportunities, then present Good / Better / Best.')+`<section class="card"><h2>Systems identified</h2><div class="systems">${['Furnace','Heat Pump','Central AC','Ductless','Humidifier','Water Heater','Tankless'].map(x=>`<button class="system ${s.systems.includes(x)?'on':''}" data-system="${x}"><b>${x}</b><small>Tap to include</small></button>`).join('')}</div></section><section class="card"><h2>Good / Better / Best</h2>${s.packages.map((p,i)=>`<div class="pkg ${s.recommended===p.tier?'rec':''}"><div class="row"><span class="tag">${p.tier}</span><button class="btn secondary" data-rec="${p.tier}">${s.recommended===p.tier?'Recommended':'Set recommended'}</button></div><div class="field"><label>Package</label><input data-pkg="${i}" data-prop="name" value="${esc(p.name)}"></div><div class="row"><div><span class="price">$<span>${p.price.toLocaleString()}</span></span></div><input type="number" data-pkg="${i}" data-prop="price" value="${p.price}"></div></div>`).join('')}</section>`}
function materials(){let selected=mats.filter(m=>{if(m[0].startsWith('furnace'))return s.systems.includes('Furnace');if(m[0].startsWith('hp'))return s.systems.includes('Heat Pump');if(m[0].startsWith('ac'))return s.systems.includes('Central AC');if(m[0].startsWith('humid'))return s.systems.includes('Humidifier');if(m[0].startsWith('tankless'))return s.systems.includes('Tankless');if(m[0].startsWith('tank'))return s.systems.includes('Water Heater');return true});return head('Build the materials list','Tap the parts required and add quantities, specs and disposition.')+`<section class="card"><h2>Suggested materials</h2>${selected.map(m=>{let v=s.materials[m[0]]||{on:false,qty:m[3],disp:'New',spec:''};return `<div class="mat"><div class="mathead"><input type="checkbox" data-mat="${m[0]}" ${v.on?'checked':''}><div><b>${m[2]}</b><div class="sub">${m[1]}</div></div></div>${v.on?`<div class="matopts"><input type="number" min="1" data-mid="${m[0]}" data-mprop="qty" value="${v.qty}"><select data-mid="${m[0]}" data-mprop="disp">${['New','Reuse Existing','Other Trade','N/A'].map(x=>`<option ${v.disp===x?'selected':''}>${x}</option>`).join('')}</select><input class="wide" data-mid="${m[0]}" data-mprop="spec" value="${esc(v.spec||'')}" placeholder="Size / spec / notes"></div>`:''}</div>`}).join('')}</section>`}
function summaryText(){let parts=mats.filter(m=>s.materials[m[0]]?.on).map(m=>{let v=s.materials[m[0]];return `${v.qty}x ${m[2]} — ${v.disp}${v.spec?' — '+v.spec:''}`}).join('\n');return `GRAVITY SALES WALKTHROUGH\nCustomer: ${s.customer.name}\nAddress: ${s.customer.address}, ${s.customer.city}\nRep: ${s.customer.rep}\n\nSYSTEMS\n${s.systems.join(', ')}\n\nRECOMMENDED\n${s.recommended}\n\nPARTS LIST\n${parts||'No materials selected'}\n\nINSTALL / PARTS NOTES\n${s.notes||''}`}
function review(){let count=Object.values(s.materials).filter(x=>x.on).length;return head('Review & send','One final check before handing the job to Parts.')+`<section class="card"><h2>Walkthrough summary</h2><div class="summary"><div class="box"><small>Customer</small><b>${esc(s.customer.name||'Not entered')}</b></div><div class="box"><small>Rep</small><b>${esc(s.customer.rep||'Not entered')}</b></div><div class="box"><small>Systems</small><b>${s.systems.length}</b><small>${esc(s.systems.join(', '))}</small></div><div class="box"><small>Parts lines</small><b>${count}</b></div></div></section><section class="card"><h2>Install / Parts notes</h2><textarea id="notes" placeholder="Measurements, access, other trade, timing...">${esc(s.notes)}</textarea></section><section class="card"><h2>Parts handoff</h2><p class="sub"><b>Recipient:</b> billy.beatty@thegravitygroup.ca</p><div class="actions"><button class="btn secondary" id="copy">Copy summary</button><button class="btn secondary" id="share">Share</button><button class="btn primary" id="email">Email Parts</button></div></section><section class="card"><button class="btn danger" id="reset">Reset walkthrough</button></section>`}
function bind(){document.querySelectorAll('[data-k]').forEach(el=>el.oninput=()=>{let [a,b]=el.dataset.k.split('.');if(b)s[a][b]=el.value;else s[a]=el.value;save()});document.querySelectorAll('[data-flag]').forEach(b=>b.onclick=()=>{s.flags=s.flags.includes(b.dataset.flag)?s.flags.filter(x=>x!==b.dataset.flag):[...s.flags,b.dataset.flag];save();render()});document.querySelectorAll('[data-system]').forEach(b=>b.onclick=()=>{s.systems=s.systems.includes(b.dataset.system)?s.systems.filter(x=>x!==b.dataset.system):[...s.systems,b.dataset.system];save();render()});document.querySelectorAll('[data-rec]').forEach(b=>b.onclick=()=>{s.recommended=b.dataset.rec;save();render()});document.querySelectorAll('[data-pkg]').forEach(el=>el.oninput=()=>{let i=+el.dataset.pkg,p=el.dataset.prop;s.packages[i][p]=p==='price'?+el.value:el.value;save()});document.querySelectorAll('[data-mat]').forEach(el=>el.onchange=()=>{let id=el.dataset.mat;s.materials[id]=s.materials[id]||{on:false,qty:1,disp:'New',spec:''};s.materials[id].on=el.checked;save();render()});document.querySelectorAll('[data-mid]').forEach(el=>el.oninput=()=>{let id=el.dataset.mid,p=el.dataset.mprop;s.materials[id][p]=el.value;save()});if(document.getElementById('notes'))document.getElementById('notes').oninput=e=>{s.notes=e.target.value;save()};if(document.getElementById('copy'))copy.onclick=async()=>{await navigator.clipboard.writeText(summaryText());alert('Summary copied')};if(document.getElementById('share'))share.onclick=async()=>{navigator.share?await navigator.share({title:'Gravity Sales Walkthrough',text:summaryText()}):alert('Share is not available on this device')};if(document.getElementById('email'))email.onclick=()=>location.href='mailto:billy.beatty@thegravitygroup.ca?subject='+encodeURIComponent('Gravity Parts List — '+(s.customer.name||'Sales Walkthrough'))+'&body='+encodeURIComponent(summaryText());if(document.getElementById('reset'))reset.onclick=()=>{if(confirm('Reset this walkthrough?')){s=blank();save();render()}}}
function render(){renderTabs();app.innerHTML=[customer,discovery,solutions,materials,review][s.step]();bind();back.disabled=s.step===0;next.textContent=s.step===4?'Done':'Next';window.scrollTo(0,0)}
back.onclick=()=>{if(s.step>0){s.step--;save();render()}};next.onclick=()=>{if(s.step<4){s.step++;save();render()}};sample.onclick=()=>{s=blank();s.customer={name:'Alex & Morgan Carter',phone:'705-555-0187',email:'alex@example.com',address:'214 Cedar Ridge Drive',city:'Peterborough',rep:'Johnny M.'};Object.assign(s.discovery,{need:'18-year-old furnace is noisy and second floor runs cold.',decision:'Both homeowners present',urgency:'Within 30 days',comfort:'Second floor cold in winter; family room warm in summer.',equipment:'18-year-old gas furnace + central AC.',air:'Dust concern; one dog.',humidity:'Very dry upstairs in winter.',water:'Tank is 11 years old.',access:'Basement mechanical room; straight stairs.',duct:'Supply transition should be rebuilt.',electric:'200A panel with space.',outdoor:'Existing AC pad; good snow clearance.'});s.flags=['Financing','Membership','Humidifier','Duct modification'];s.systems=['Furnace','Heat Pump','Humidifier'];['furnace','furnace-filter','furnace-vent','furnace-drain','furnace-trans','hp','hp-coil','hp-lineset','hp-pad','hp-elec','humid','humid-kit','common','common-elec','common-fast'].forEach(id=>s.materials[id]={on:true,qty:1,disp:'New',spec:''});s.notes='Confirm furnace width and heat-pump electrical requirements before order.';save();render()};render();
</script>
</body>
</html>
